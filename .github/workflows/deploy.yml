name: Deploy

on:
  push:
    branches: [main]
    # Docs don't reach the site; skip the build for docs-only pushes.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  ODIN_VERSION: dev-2026-10

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore Odin
        id: odin-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/odin
          key: odin-${{ env.ODIN_VERSION }}-linux-amd64

      - name: Download Odin
        if: steps.odin-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/odin
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz" \
            | tar -xz -C ~/odin --strip-components=1

      # Saved straight away, so a failing test run still keeps the cache.
      - name: Save Odin
        if: steps.odin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/odin
          key: odin-${{ env.ODIN_VERSION }}-linux-amd64

      # Odin links js_wasm32 with wasm-ld from PATH; the release doesn't ship it.
      - name: Toolchain on PATH
        run: |
          echo "$HOME/odin" >> "$GITHUB_PATH"
          ld=$(ls /usr/lib/llvm-*/bin/wasm-ld 2>/dev/null | sort -V | tail -1)
          if [ -z "$ld" ]; then
            echo "wasm-ld not on image, installing lld-18"
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends lld-18
            ld=/usr/lib/llvm-18/bin/wasm-ld
          fi
          echo "using $ld"
          dirname "$ld" >> "$GITHUB_PATH"

      # test.sh also runs build.sh, which assembles build/ for the deploy.
      - name: Test and build
        run: |
          odin version
          ./test.sh

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
