<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Creatures</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f4f2; --fg: #1d1d1b; --panel: #e6e6e2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18181a; --fg: #e8e8e6; --panel: #26262a; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 12px; background: var(--panel); border-radius: 6px; }
  label { display: flex; gap: 6px; align-items: center; }
  .stage { margin-top: 16px; width: 640px; max-width: 100%; }
  .screen { position: relative; }
  .stage:fullscreen { display: grid; place-items: center; width: 100vw; max-width: none; height: 100vh; margin: 0; background: #000; }
  .stage:fullscreen .screen { width: min(100vw, calc(100vh * 4 / 3)); }
  .stage.saver, .stage.saver * { cursor: none !important; }
  #view { display: block; width: 100%; image-rendering: pixelated; touch-action: none; }
  #overlay, #ui-text { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #status { font-variant-numeric: tabular-nums; margin-top: 8px; }
  .debug { display: none; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
  body.show-debug .debug { display: flex; }
  .debug pre { margin: 0; padding: 8px 12px; background: var(--panel); border-radius: 6px;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; overflow: auto; }
  #debug-log { height: 220px; width: 520px; max-width: 100%; }
  .message { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / 0.45); }
  .message[hidden] { display: none; }
  .message-box { max-width: 420px; padding: 16px 20px; background: var(--panel); border-radius: 8px; }
  .message-box p { margin: 8px 0 12px; }
</style>
</head>
<body data-mode="tank">
<div class="bar">
  <label>Variant <select id="variant"><option value="cr">Chile Rose</option><option value="rk">Red Knee</option></select></label>
  <label>Sim speed <input id="speed" type="range" min="1" max="20" step="1" value="1"><span id="speedv">1×</span></label>
  <label>Volume <input id="volume" type="range" min="0" max="100" step="5" value="100"></label>
  <label><input id="smooth" type="checkbox"> Smooth motion</label>
  <button id="fullscreen">Full screen <kbd>F</kbd></button>
  <button id="saver">Screensaver</button>
  <label>after <select id="idle"><option value="0">never</option><option value="2">2 min</option><option value="5" selected>5 min</option><option value="10">10 min</option><option value="30">30 min</option></select></label>
  <label>Name <input id="pet-name" maxlength="20" size="12" placeholder="ENTER PETS NAME HERE"></label>
  <button id="new-spider">New spider</button>
  <button id="drop">Drop cricket <kbd>C</kbd></button>
  <label><input id="debug" type="checkbox"> Debug <kbd>D</kbd></label>
  <a href="viewer.html">Animation viewer →</a>
</div>
<div class="stage" id="stage">
  <div class="screen">
    <canvas id="view" width="640" height="480"></canvas>
    <canvas id="ui-text" width="640" height="480"></canvas>
    <canvas id="overlay" width="640" height="480"></canvas>
  </div>
  <div id="message" class="message" hidden>
    <div class="message-box">
      <strong id="message-title"></strong>
      <p id="message-text"></p>
      <button id="message-ok">OK</button>
    </div>
  </div>
</div>
<div id="status"></div>
<div class="debug">
  <pre id="debug-panel"></pre>
  <pre id="debug-log"></pre>
</div>
<script src="odin.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
