<style>
  /* the page around the tank: a gunmetal cabinet in the spirit of the
     game's own window frame */
  :root { color-scheme: dark; --fg: #d8d6d2; --dim: #8c8a86; --accent: #ff7a1a; --panel: #1d1e21;
    /* the view: 1.5 x the original 640 x 480, smaller when the window is.
       --ar: its width / height, 4/3 or wider for a wide view (set by the
       script at the end of the page) */
    --ar: 1.33333;
    --w: min(calc(720px * var(--ar)), calc(100vw - 72px), calc((100vh - 250px - var(--chrome-v)) * var(--ar)));
    /* what a page style's decorations take (themes.css) */
    --chrome-v: 0px; --chrome-top: 0px; --chrome-bottom: 0px; }
  * { box-sizing: border-box; }
  /* no text autosizing (iPhones enlarge some text when the layout's width
     changes, as Wide does) */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  /* 100dvh: the visible viewport (100vh on phones counts the space under
     the browser's toolbars too) */
  body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--fg);
    padding: calc(12px + var(--chrome-top) + env(safe-area-inset-top)) 16px calc(24px + var(--chrome-bottom) + env(safe-area-inset-bottom)) 16px;
    font: 13px/1.4 Verdana, Tahoma, system-ui, sans-serif;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, #3a1d0c 0%, #140d0a 45%, #08080a 100%) fixed, #08080a;
    display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 9px; align-items: center;
    padding: 6px 10px; border-radius: 10px; border: 1px solid #000;
    background: linear-gradient(#3a3c41, #1e1f22); box-shadow: inset 0 1px 0 #ffffff26, 0 4px 14px #0009; }
  .bar a { color: var(--accent); }
  label { display: flex; gap: 6px; align-items: center; }
  button, select, input[type=text], input:not([type]) { font: inherit; color: var(--fg); border: 1px solid #000; border-radius: 6px;
    background: linear-gradient(#4a4c52, #2a2b2f); box-shadow: inset 0 1px 0 #ffffff2e; padding: 3px 9px; }
  button:hover { background: linear-gradient(#5a5c63, #33353a); }
  button:active { background: linear-gradient(#25262a, #3a3c41); }
  kbd { font: 10px Verdana, sans-serif; color: var(--dim); }
  input[type=range] { width: 84px; accent-color: var(--accent); }

  .cabinet { position: relative; margin: auto 0; padding: 14px 18px 12px; border-radius: 22px; border: 1px solid #000;
    background:
      repeating-linear-gradient(90deg, #ffffff05 0 1px, transparent 1px 3px),
      linear-gradient(#64676e, #34363b 18%, #222326 60%, #2e3034);
    box-shadow: inset 0 1px 0 #ffffff40, inset 0 -3px 6px #0008, 0 0 0 4px #0c0c0e, 0 0 0 5px #3a3c41, 0 24px 70px #000c; }
  .cabinet::before, .cabinet::after { content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #d0d2d6, #5a5c61 55%, #1a1b1d); top: 9px; box-shadow: 0 1px 1px #000; }
  .cabinet::before { left: 9px; }
  .cabinet::after { right: 9px; }
  .leds { position: absolute; top: 3px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  .leds i { width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffd2a0, #ff5a00 60%, #6a1a00);
    box-shadow: 0 0 6px #ff6a00; }
  .leds i + i { background: radial-gradient(circle at 35% 35%, #fff2a0, #c9a200 60%, #4a3a00); box-shadow: 0 0 6px #c9a200; }
  .stage { width: var(--w); margin-top: 6px; border: 2px solid #0a0a0b; box-shadow: 0 0 0 1px #ff7a1a55, inset 0 0 0 1px #000; background: #000; }
  .screen { position: relative; }
  .foot { display: flex; align-items: center; gap: 12px; width: var(--w); margin-top: 10px; }
  .grill { flex: 1; height: 12px; border-radius: 3px; border: 1px solid #000;
    background: repeating-linear-gradient(90deg, #0d0d0f 0 3px, #45474c 3px 5px); box-shadow: inset 0 2px 3px #000c; }
  .plate { font: bold 11px Verdana, sans-serif; letter-spacing: 0.25em; color: #c8c6c2; text-shadow: 0 1px 0 #000;
    padding: 3px 12px; border-radius: 4px; border: 1px solid #000; background: linear-gradient(#2a2b2f, #17181a); }
  .stage:fullscreen { display: grid; place-items: center; width: 100vw; height: 100vh; border: 0; box-shadow: none; background: #000; }
  .stage:fullscreen .screen { width: min(100vw, calc(100vh * var(--ar))); }
  /* full screen where a page can't have it (iPhones): the stage fills the
     browser window */
  body.fill { overflow: hidden; }
  /* everything but the tank out of sight, the page black: a browser that
     keeps the stage out of the notch strips (Brave on iPhones) shows black
     there, not the page */
  :root[data-theme] body.fill { background: #000; }
  body.fill * { visibility: hidden; }
  body.fill .stage, body.fill .stage * { visibility: visible; }
  :root[data-theme] body.fill .stage { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; width: 100vw; height: 100dvh;
    margin: 0; border: 0; box-shadow: none; background: #000; }
  :root[data-theme] body.fill .stage .screen { width: min(100vw, calc(100dvh * var(--ar))); }
  .stage.saver, .stage.saver * { cursor: none !important; }
  #view { display: block; width: 100%; image-rendering: pixelated; touch-action: none; }
  #overlay, #ui-text { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* debug tools: one see-through window at the top right (under the
     toolbar on wide screens), fixed in place so it never moves the
     layout, as tall as the window allows up to 560 px. Three parts: the
     creature's line at the top, then the state and the log in wells of
     their own, the log the larger; long lines wrap, overflow scrolls. The
     wells' colours are variables, set per page style for the panel docked
     in the settings (phones, themes.css) */
  .debug { display: none; position: fixed; z-index: 20; top: calc(64px + var(--chrome-top)); right: 12px;
    width: min(380px, calc(100vw - 24px)); height: min(560px, calc(100dvh - 76px - var(--chrome-top) - var(--chrome-bottom)));
    flex-direction: column; gap: 4px; padding: 6px 9px;
    background: rgb(8 8 10 / 0.68); color: #cfd2cf; border: 1px solid rgb(255 255 255 / 0.12); border-radius: 8px;
    box-shadow: 0 4px 16px rgb(0 0 0 / 0.4);
    --dbg-state-bg: rgb(255 255 255 / 0.06); --dbg-log-bg: rgb(0 0 0 / 0.5); --dbg-log-fg: #e6e8e4;
    --dbg-edge: rgb(255 255 255 / 0.1); --dbg-shadow: none; --dbg-radius: 5px; }
  body.show-debug .debug { display: flex; }
  .dbg { margin: 0; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums;
    white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; }
  #status { flex: none; padding: 0 2px; }
  #debug-panel, #debug-log { min-height: 0; border: 1px solid; border-color: var(--dbg-edge); border-radius: var(--dbg-radius);
    box-shadow: var(--dbg-shadow); }
  #debug-panel { flex: 1 1 0; padding: 5px 7px; background: var(--dbg-state-bg); }
  #debug-log { flex: 1.3 1 0; padding: 3px; font-size: 11.5px; line-height: 1.45; color: var(--dbg-log-fg); background: var(--dbg-log-bg); }
  /* the log: one row per entry, its time in a column of its own, rows
     striped so long entries stay apart */
  #debug-log > div { display: grid; grid-template-columns: 7ch minmax(0, 1fr); gap: 1.2ch; padding: 2px 5px; border-radius: 3px; }
  #debug-log > div:nth-child(even) { background: var(--dbg-stripe, color-mix(in srgb, currentColor 8%, transparent)); }
  #debug-log > div > span { text-align: right; color: var(--dbg-time, inherit); opacity: var(--dbg-time-alpha, 0.6); }
  /* the docked panel's Back button and the menu's way back to it (phones) */
  .dbg-head, #debug-open { display: none; }
  .dbg-toggle { display: flex; gap: 8px; align-items: center; }
  .message { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / 0.55); }
  .message[hidden] { display: none; }
  .message-box { max-width: 420px; padding: 16px 20px; border-radius: 12px; border: 1px solid #000;
    background: linear-gradient(#45474c, #222326); box-shadow: inset 0 1px 0 #ffffff33, 0 10px 40px #000; }
  .message-box strong { color: var(--accent); letter-spacing: 0.05em; }
  .message-box p { margin: 8px 0 12px; }
  /* touch: no browser gestures on the game; the tool cursor under the finger */
  html, body { overscroll-behavior: none; touch-action: manipulation; }
  .stage { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* loading: a dialog of the game's day (Windows 2000) on the black screen,
     sized with the view */
  .loader { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; background: #000;
    color: #000; font: max(11px, calc(var(--w) / var(--ar) * 11 / 480))/1.3 Tahoma, Verdana, "MS Sans Serif", sans-serif; }
  .win { width: 24em; padding: 0.25em; background: #d4d0c8; border: 1px solid;
    border-color: #d4d0c8 #404040 #404040 #d4d0c8; box-shadow: inset 1px 1px #fff, inset -1px -1px #808080; }
  .win-title { padding: 0.2em 0.4em; color: #fff; font-weight: bold; background: linear-gradient(90deg, #0a246a, #a6caf0); }
  .win-body { padding: 0.9em 0.8em 0.8em; }
  .win-body p { margin: 0 0 0.6em; }
  .win-track { height: 1.4em; padding: 0.15em; border: 1px solid; border-color: #808080 #fff #fff #808080;
    box-shadow: inset 1px 1px #404040; }
  #loader-fill { width: 0; height: 100%; background: repeating-linear-gradient(90deg, #0a246a 0 0.55em, transparent 0.55em 0.75em); }
  /* the pet's name on a phone: a text box for the keyboard, out of sight
     (16 px, or iOS zooms in on it) */
  .name-box { position: absolute; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0;
    opacity: 0; font-size: 16px; pointer-events: none; }
  #finger { position: absolute; pointer-events: none; image-rendering: pixelated; z-index: 2; }
  /* in an embed (X's player): the way out to the full page, in the top
     right corner over the loader too, styled like X's own buttons over
     media (a dark see-through pill) */
  .open-full { position: absolute; z-index: 4; top: 6px; right: 6px; display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 9px; border-radius: 999px; border: 1px solid rgb(255 255 255 / 0.35); background: rgb(0 0 0 / 0.6);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); color: #fff;
    font: 700 11px/1 system-ui, -apple-system, "Segoe UI", sans-serif; text-decoration: none; transition: background 0.15s; }
  .open-full:hover, .open-full:focus-visible { background: rgb(0 0 0 / 0.78); }
  .open-full:focus-visible { outline: 2px solid #1d9bf0; outline-offset: 2px; }
  .open-full svg { width: 11px; height: 11px; }
  .gear { display: none; }

  /* up to 1224 px wide the settings would wrap onto a second row: they fold
     into a gear button, or, where the height allows the tank at full width
     with the settings below it, they go there (body.room-below, set by the
     script at the end of the page), the two centred together */
  @media (max-width: 1224px), (max-height: 600px) {
    :root { --w: min(calc(720px * var(--ar)), calc(100vw - 72px), calc((100dvh - 130px - var(--chrome-v)) * var(--ar))); }
    .gear { display: grid; place-items: center; position: fixed; z-index: 30; width: 38px; height: 38px; padding: 0;
      top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right));
      font-size: 20px; border-radius: 50%; background: rgb(30 31 34 / 0.85); }
    .bar { display: none; position: fixed; z-index: 29; right: calc(8px + env(safe-area-inset-right));
      top: calc(54px + env(safe-area-inset-top)); width: min(360px, calc(100vw - 16px));
      max-height: calc(100dvh - 70px); overflow: auto; flex-direction: column; align-items: stretch; }
    body.bar-open .bar { display: flex; }
    .bar label { justify-content: space-between; }
    .bar input[type=range] { flex: 1; }
    .bar kbd { display: none; }
    body.room-below { --w: min(calc(720px * var(--ar)), calc(100vw - 72px)); justify-content: center; }
    body.room-below .cabinet { order: 0; margin: 0; }
    body.room-below .gear { display: none; }
    body.room-below .bar { display: flex; position: static; order: 1; width: calc(var(--w) + 38px); max-height: none; }
  }
  /* small screens: the cabinet becomes a thin bezel and the tank takes the
     room there is: full width in portrait, the full height in landscape */
  @media (max-width: 760px), (max-height: 600px) {
    :root { --w: min(calc(720px * var(--ar)), calc(100vw - 20px - env(safe-area-inset-left) - env(safe-area-inset-right)),
      calc((100dvh - 24px - var(--chrome-v) - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * var(--ar))); }
    body.room-below { --w: min(calc(720px * var(--ar)), calc(100vw - 20px - env(safe-area-inset-left) - env(safe-area-inset-right))); }
    body { padding: calc(6px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right))
      calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left)); gap: 8px; }
    .cabinet { margin: auto 0; padding: 4px; border-radius: 10px; box-shadow: inset 0 1px 0 #ffffff40, 0 8px 24px #000c; }
    .cabinet::before, .cabinet::after, .leds, .foot { display: none; }
    .stage { margin-top: 0; }
    body.room-below .bar { width: calc(var(--w) + 10px); }
  }
  /* no room below in landscape: the gear at the right, in the middle of the
     strip beside the tank (on a phone with a notch, the safe area the tank
     keeps clear of), else in the corner */
  @media (max-width: 760px) and (min-aspect-ratio: 5/4), (max-height: 600px) and (min-aspect-ratio: 5/4) {
    .gear { top: calc(6px + env(safe-area-inset-top)); right: max(2px, calc((env(safe-area-inset-right) + 10px - 38px) / 2)); }
  }

  /* settings folded: under the gear at the top right; settings below
     the tank: nothing above it */
  @media (max-width: 1224px), (max-height: 600px) {
    body.room-below .debug { top: calc(12px + var(--chrome-top)); height: min(560px, calc(100dvh - 24px - var(--chrome-top) - var(--chrome-bottom))); }
    body:where(:not(.room-below)) .debug { top: calc(54px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right));
      width: min(380px, calc(100vw - 16px - env(safe-area-inset-left) - env(safe-area-inset-right)));
      height: min(560px, calc(100dvh - 62px - env(safe-area-inset-top) - env(safe-area-inset-bottom))); }
  }
  @media (max-width: 760px), (max-height: 600px) {
    /* the settings below the tank (portrait phones): the tools take the
       settings' place instead (from "Show panel", body.debug-open), in the
       settings' own box and size, with a Back button to the settings; the
       script moves .debug into .bar for this. Back and the creature's line
       share the top row; the state is a tinted well, the log a field in the
       page style's own colours (Canvas: white in the light styles) */
    body.room-below .bar { position: relative; inset: auto; }
    body.room-below .bar > .debug { position: absolute; inset: 0; z-index: auto; width: auto; height: auto; padding: inherit;
      color: inherit; background: none; border: 0; border-radius: inherit; box-shadow: none;
      grid-template: "head status" auto "panel panel" minmax(0, 1fr) "log log" minmax(0, 1.3fr) / auto minmax(0, 1fr); gap: 6px 8px; }
    body.room-below.show-debug.debug-open .bar > .debug { display: grid; }
    body.room-below.show-debug:not(.debug-open) .bar > .debug { display: none; }
    body.room-below.show-debug.debug-open .bar > :not(.debug) { visibility: hidden; }
    body.room-below .bar .dbg-head { display: flex; grid-area: head; align-self: center; }
    body.room-below .bar #status { grid-area: status; align-self: center; font-size: 10.5px; line-height: 1.3; }
    body.room-below .bar #debug-panel { grid-area: panel; }
    body.room-below .bar #debug-log { grid-area: log; }
    /* the base style's wells: pressed into the gunmetal, the log the
       deeper, its times in the accent */
    body.room-below .bar > .debug { --dbg-state-bg: rgb(0 0 0 / 0.2); --dbg-log-bg: rgb(0 0 0 / 0.42); --dbg-log-fg: #d8d6d2;
      --dbg-edge: #000; --dbg-shadow: inset 0 1px 3px #0009, 0 1px 0 #ffffff12; --dbg-radius: 6px;
      --dbg-stripe: rgb(255 255 255 / 0.035); --dbg-time: var(--accent); --dbg-time-alpha: 0.8; }
    /* "Show panel" always takes its room (it's taller than the checkbox),
       shown only while there's a panel to show: the settings keep their
       height whether debug is on or off */
    body.room-below #debug-open { display: block; visibility: hidden; }
    body.room-below.show-debug:not(.debug-open) #debug-open { visibility: visible; }
  }
  /* landscape (the gear at the left), the screen about the window's
     height or less: the whole height, at the right */
  @media (max-width: 760px) and (min-aspect-ratio: 5/4), (max-height: 600px) and (min-aspect-ratio: 5/4) {
    body .debug { top: 0; right: 0; height: 100dvh; border-width: 0 0 0 1px; border-radius: 0;
      padding: calc(6px + env(safe-area-inset-top)) calc(9px + env(safe-area-inset-right))
        calc(6px + env(safe-area-inset-bottom)) 9px; }
  }
</style>

<script>
  // Room for the settings below the tank? Only where they'd fold (up to
  // 1224 px wide), and only if the tank keeps its full width: the stacked
  // layout is tried, and kept if the page doesn't overflow (whatever the
  // page style puts round it).
  (() => {
    const fold = matchMedia("(max-width: 1224px), (max-height: 600px)");
    const small = matchMedia("(max-width: 760px), (max-height: 600px)");
    const root = document.documentElement;
    const tools = document.getElementById("debug-tools"), home = tools.nextSibling;
    const bar = document.querySelector(".bar");

    // The view's width: the original 640 x 480, or with Wide as wide as the
    // room allows, up to the whole tank (1200); the height stays 480. --ar
    // sizes the page, and the game hears of it (vc-view-width, main.js).
    // Wide is the viewer's choice (kept), except on a phone held sideways (a
    // touch screen in landscape, at most 500 px high): there it's on, unless
    // unticked while it's sideways; turned back upright, the choice returns.
    const sideways = matchMedia("(pointer: coarse) and (orientation: landscape) and (max-height: 500px)");
    const wide = document.getElementById("wide");
    let wideChoice = false, sidewaysWide = null, wasSideways = false; // (null: on, not unticked)
    try { wideChoice = localStorage.getItem("vc-wide") === "1"; } catch {}
    // (never in an embed: X's player is 640 x 480, the plain view's shape)
    const embedded = new URLSearchParams(location.search).has("embed");
    const wideOn = () => !embedded && (sideways.matches ? sidewaysWide ?? true : wideChoice);
    window.vcViewWidth = 640;
    const viewWidth = () => {
      if (!wideOn()) return 640;
      // the room for the screen, as the --w rules leave it
      const chrome = parseFloat(getComputedStyle(root).getPropertyValue("--chrome-v")) || 0;
      let w = innerWidth - 72, h = innerHeight - 250 - chrome;
      if (document.body.classList.contains("fill") || document.fullscreenElement) [w, h] = [innerWidth, innerHeight];
      else if (small.matches) [w, h] = [innerWidth - 20, innerHeight - 24 - chrome];
      else if (fold.matches) h = innerHeight - 130 - chrome;
      return Math.max(640, Math.min(1200, Math.floor(480 * w / Math.max(h, 1)))) & ~1;
    };
    const layout = () => {
      const b = document.body;
      // each time it's turned sideways it starts wide
      if (sideways.matches !== wasSideways) [wasSideways, sidewaysWide] = [sideways.matches, null];
      wide.checked = wideOn();
      const vw = viewWidth();
      if (vw !== window.vcViewWidth) {
        window.vcViewWidth = vw;
        root.style.setProperty("--ar", (vw / 480).toFixed(5));
        dispatchEvent(new CustomEvent("vc-view-width", { detail: vw }));
      }
      b.classList.toggle("room-below", fold.matches);
      // (against innerHeight, which follows a phone's toolbars like the
      // page's 100dvh does; a pixel of slack, as those can be fractional)
      if (fold.matches && root.scrollHeight > innerHeight + 1) b.classList.remove("room-below");
      // a phone with the settings below the tank: the debug tools go in
      // their box (shown in their place)
      const dock = small.matches && b.classList.contains("room-below");
      if (dock !== (tools.parentNode === bar)) dock ? bar.append(tools) : b.insertBefore(tools, home);
    };
    layout();
    addEventListener("resize", layout);
    document.addEventListener("fullscreenchange", layout);
    wide.onchange = () => {
      if (sideways.matches) sidewaysWide = wide.checked; // for while it's sideways
      else {
        wideChoice = wide.checked;
        try { localStorage.setItem("vc-wide", wideChoice ? "1" : ""); } catch {}
      }
      layout();
    };
    sideways.addEventListener("change", layout);

    // the page style
    const theme = document.getElementById("theme");
    theme.value = root.dataset.theme;
    if (theme.value !== root.dataset.theme) root.dataset.theme = theme.value = "win98";
    // the browser's bar follows the page style's background
    const themeColor = document.querySelector('meta[name="theme-color"]');
    const tint = () => { themeColor.content = getComputedStyle(document.body).backgroundColor; };
    tint();
    theme.onchange = () => {
      root.dataset.theme = theme.value;
      tint();
      try { localStorage.setItem("vc-theme", theme.value); } catch {}
      layout();
    };
    // the taskbar's clock
    const clock = () => {
      const t = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      for (const c of document.querySelectorAll(".clock")) c.textContent = t;
    };
    clock();
    setInterval(clock, 15_000);
  })();
</script>
