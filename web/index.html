<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual Creatures</title>
<style>
  /* the page around the tank: a gunmetal cabinet in the spirit of the
     game's own window frame */
  :root { color-scheme: dark; --fg: #d8d6d2; --dim: #8c8a86; --accent: #ff7a1a; --panel: #1d1e21;
    /* the view: 1.5 x the original 640 x 480, smaller when the window is */
    --w: min(960px, calc(100vw - 72px), calc((100vh - 250px) * 4 / 3)); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding: 12px 16px 24px; color: var(--fg);
    font: 13px/1.4 Verdana, Tahoma, system-ui, sans-serif;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, #3a1d0c 0%, #140d0a 45%, #08080a 100%) fixed, #08080a;
    display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; align-items: center;
    padding: 6px 14px; border-radius: 10px; border: 1px solid #000;
    background: linear-gradient(#3a3c41, #1e1f22); box-shadow: inset 0 1px 0 #ffffff26, 0 4px 14px #0009; }
  .bar a { color: var(--accent); }
  label { display: flex; gap: 6px; align-items: center; }
  button, select, input[type=text], input:not([type]) { font: inherit; color: var(--fg); border: 1px solid #000; border-radius: 6px;
    background: linear-gradient(#4a4c52, #2a2b2f); box-shadow: inset 0 1px 0 #ffffff2e; padding: 3px 9px; }
  button:hover { background: linear-gradient(#5a5c63, #33353a); }
  button:active { background: linear-gradient(#25262a, #3a3c41); }
  kbd { font: 10px Verdana, sans-serif; color: var(--dim); }
  input[type=range] { accent-color: var(--accent); }

  .cabinet { position: relative; margin: auto 0; padding: 14px 18px 12px; border-radius: 22px; border: 1px solid #000;
    background:
      repeating-linear-gradient(90deg, #ffffff05 0 1px, transparent 1px 3px),
      linear-gradient(#64676e, #34363b 18%, #222326 60%, #2e3034);
    box-shadow: inset 0 1px 0 #ffffff40, inset 0 -3px 6px #0008, 0 0 0 4px #0c0c0e, 0 0 0 5px #3a3c41, 0 24px 70px #000c; }
  .cabinet::before, .cabinet::after { content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #d0d2d6, #5a5c61 55%, #1a1b1d); top: 9px; box-shadow: 0 1px 1px #000; }
  .cabinet::before { left: 9px; }
  .cabinet::after { right: 9px; }
  .leds { position: absolute; top: 3px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  .leds i { width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffd2a0, #ff5a00 60%, #6a1a00);
    box-shadow: 0 0 6px #ff6a00; }
  .leds i + i { background: radial-gradient(circle at 35% 35%, #fff2a0, #c9a200 60%, #4a3a00); box-shadow: 0 0 6px #c9a200; }
  .stage { width: var(--w); margin-top: 6px; border: 2px solid #0a0a0b; box-shadow: 0 0 0 1px #ff7a1a55, inset 0 0 0 1px #000; background: #000; }
  .screen { position: relative; }
  .foot { display: flex; align-items: center; gap: 12px; width: var(--w); margin-top: 10px; }
  .grill { flex: 1; height: 12px; border-radius: 3px; border: 1px solid #000;
    background: repeating-linear-gradient(90deg, #0d0d0f 0 3px, #45474c 3px 5px); box-shadow: inset 0 2px 3px #000c; }
  .plate { font: bold 11px Verdana, sans-serif; letter-spacing: 0.25em; color: #c8c6c2; text-shadow: 0 1px 0 #000;
    padding: 3px 12px; border-radius: 4px; border: 1px solid #000; background: linear-gradient(#2a2b2f, #17181a); }
  .stage:fullscreen { display: grid; place-items: center; width: 100vw; height: 100vh; border: 0; box-shadow: none; background: #000; }
  .stage:fullscreen .screen { width: min(100vw, calc(100vh * 4 / 3)); }
  .stage.saver, .stage.saver * { cursor: none !important; }
  #view { display: block; width: 100%; image-rendering: pixelated; touch-action: none; }
  #overlay, #ui-text { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #ui-text { image-rendering: pixelated; }
  /* debug tools: small see-through windows over the page, fixed in place
     so they never move the layout; long lines wrap, overflow scrolls */
  .debug, #status { display: none; }
  body.show-debug .debug, body.show-debug #status { display: block; }
  .dbg { position: fixed; z-index: 20; margin: 0; padding: 6px 9px; box-sizing: border-box;
    background: rgb(8 8 10 / 0.68); color: #cfd2cf; border: 1px solid rgb(255 255 255 / 0.12); border-radius: 8px;
    box-shadow: 0 4px 16px rgb(0 0 0 / 0.4);
    font: 10.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums;
    white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; }
  #debug-panel { top: 84px; left: 12px; width: 400px; max-width: calc(100vw - 24px); max-height: calc(100vh - 290px); }
  #debug-log { bottom: 12px; left: 12px; width: 400px; max-width: calc(100vw - 24px); height: 150px; }
  #status { bottom: 12px; right: 12px; max-width: 360px; }
  .message { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / 0.55); }
  .message[hidden] { display: none; }
  .message-box { max-width: 420px; padding: 16px 20px; border-radius: 12px; border: 1px solid #000;
    background: linear-gradient(#45474c, #222326); box-shadow: inset 0 1px 0 #ffffff33, 0 10px 40px #000; }
  .message-box strong { color: var(--accent); letter-spacing: 0.05em; }
  .message-box p { margin: 8px 0 12px; }
  /* touch: no browser gestures on the game; the tool cursor under the finger */
  html, body { overscroll-behavior: none; }
  body { touch-action: manipulation; }
  .stage { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #finger { position: absolute; pointer-events: none; image-rendering: pixelated; z-index: 2; }
  .gear { display: none; }

  /* small screens: the settings fold into a gear button, the cabinet becomes
     a thin bezel and the tank takes the room there is: full width at the
     top in portrait, the full height in landscape */
  @media (max-width: 760px), (max-height: 600px) {
    :root { --w: min(960px, calc(100vw - 20px - env(safe-area-inset-left) - env(safe-area-inset-right)),
      calc((100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 4 / 3)); }
    body { padding: calc(6px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right))
      calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left)); gap: 8px; }
    .cabinet { margin: 0; padding: 4px; border-radius: 10px; box-shadow: inset 0 1px 0 #ffffff40, 0 8px 24px #000c; }
    .cabinet::before, .cabinet::after, .leds, .foot { display: none; }
    .stage { margin-top: 0; }
    .gear { display: grid; place-items: center; position: fixed; z-index: 30; width: 38px; height: 38px; padding: 0;
      top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right));
      font-size: 20px; border-radius: 50%; background: rgb(30 31 34 / 0.85); }
    .bar { display: none; position: fixed; z-index: 29; left: 8px; right: 8px; top: calc(54px + env(safe-area-inset-top));
      max-height: calc(100dvh - 70px); overflow: auto; flex-direction: column; align-items: stretch; }
    body.bar-open .bar { display: flex; }
    .bar label { justify-content: space-between; }
    .bar input[type=range] { flex: 1; }
    .bar kbd { display: none; }
  }
  /* room below the tank (portrait, or nearly square): the gear and the
     settings go below it */
  @media (max-width: 760px) and (max-aspect-ratio: 5/4), (max-height: 600px) and (max-aspect-ratio: 5/4) {
    .cabinet { order: 0; }
    .gear, body.bar-open .gear { display: none; }
    .bar, body.bar-open .bar { display: flex; position: static; order: 1; width: calc(var(--w) + 10px); max-height: none; }
    #status, .debug { order: 3; }
  }
  /* room beside the tank (landscape): the gear floats at the left */
  @media (max-width: 760px) and (min-aspect-ratio: 5/4), (max-height: 600px) and (min-aspect-ratio: 5/4) {
    .gear { right: auto; left: calc(8px + env(safe-area-inset-left)); }
    .bar { right: auto; width: min(360px, calc(100vw - 16px)); }
  }
</style>
</head>
<body data-mode="tank">
<button id="menu" class="gear" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
<div class="bar">
  <label>Variant <select id="variant"><option value="cr">Chile Rose</option><option value="rk">Red Knee</option></select></label>
  <label>Sim speed <input id="speed" type="range" min="1" max="20" step="1" value="1"><span id="speedv">1×</span></label>
  <label>Volume <input id="volume" type="range" min="0" max="100" step="5" value="100"></label>
  <label>Audio <select id="audio" title="How sounds are produced"><option value="gritty">Original, gritty</option><option value="smooth">Original, smooth</option><option value="modern">Modern</option></select></label>
  <button id="fullscreen">Full screen <kbd>⇧F</kbd></button>
  <label>Name <input id="pet-name" maxlength="20" size="12" placeholder="ENTER PETS NAME HERE"></label>
  <button id="new-spider">New spider</button>
  <label>Debug <kbd>⇧D</kbd> <input id="debug" type="checkbox"></label>
  <a href="viewer.html" id="viewer-link" hidden>Animation viewer →</a>
</div>
<div class="cabinet">
<span class="leds"><i></i><i></i></span>
<div class="stage" id="stage">
  <div class="screen">
    <canvas id="view" width="640" height="480"></canvas>
    <canvas id="ui-text" width="640" height="480"></canvas>
    <canvas id="overlay" width="640" height="480"></canvas>
    <img id="finger" alt="" hidden>
  </div>
  <div id="message" class="message" hidden>
    <div class="message-box">
      <strong id="message-title"></strong>
      <p id="message-text"></p>
      <button id="message-ok">OK</button>
    </div>
  </div>
</div>
<div class="foot"><span class="grill"></span><span class="plate" id="plate">SPIDER TANK</span><span class="grill"></span></div>
</div>
<div id="status" class="dbg"></div>
<div class="debug">
  <pre id="debug-panel" class="dbg"></pre>
  <pre id="debug-log" class="dbg"></pre>
</div>
<script src="odin.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
